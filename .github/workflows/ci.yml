name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Installer Node
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3. Installer dépendances
      - name: Install dependencies
        run: npm install

      # 4. Lancer les tests (si tu en as)
      - name: Run tests
        run: npm test

      # 5. Build Docker
      - name: Build Docker image
        run: docker build -t even_221:${{ github.sha }} .