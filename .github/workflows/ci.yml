name: CI Docker Build & Push

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Setup Node
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3. Install
      - name: Install dependencies
        run: npm install

      # 4. Tests
      - name: Run tests
        run: npm test

      # 5. Login Docker Hub 🔐
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # 6. Build image 🐳
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/even_221:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/even_221:latest \
            .

      # 7. Push image 🚀
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/even_221:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/even_221:latest